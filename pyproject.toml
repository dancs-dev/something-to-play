[project]
name = "game-recommender"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-q2>=1.11.1",
    "gunicorn>=23,<24",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]",
    "mypy",
    "playwright>=1.63.0",
    "pre-commit>=4.6.2",
    "ruff",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "ANN", "B", "DJ", "SIM", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["django_q.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
