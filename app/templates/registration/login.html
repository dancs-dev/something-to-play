{% extends 'app/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button>Log in</button>
  </form>
  <p><a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
