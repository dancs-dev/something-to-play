{% extends 'app/base.html' %}
{% block content %}
  <h1>Past picks</h1>
  <section class="panel">
    {% for run in runs %}
      <p><a href="{% url 'run' run.pk %}"><time datetime="{{ run.created_at|date:'c' }}" data-local-time>{{ run.created_at|date:'M j, Y H:i' }} UTC</time></a>{% if run.inputs.request %} · {{ run.inputs.request }}{% endif %}</p>
    {% empty %}
      <p>No picks yet. <a href="{% url 'home' %}">Find a game</a>.</p>
    {% endfor %}
  </section>
{% endblock %}
