{% extends 'app/base.html' %}
{% block content %}
  <h1>Past picks</h1>
  <section class="panel">
    {% for run in runs %}
      <p><a href="{% url 'run' run.pk %}">{{ run.created_at }}</a>{% if run.inputs.request %} · {{ run.inputs.request }}{% endif %}</p>
    {% empty %}
      <p>Your next good game starts <a href="{% url 'home' %}">here</a>.</p>
    {% endfor %}
  </section>
{% endblock %}
