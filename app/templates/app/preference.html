{% extends 'app/base.html' %}
{% block content %}
<section class="panel narrow">
  <h1>{% if preference %}Edit{% else %}Add{% endif %} a game</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button>Save game</button>
    <a href="{% url 'home' %}">Cancel</a>
  </form>
</section>
{% endblock %}
